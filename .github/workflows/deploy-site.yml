name: Deploy GitHub Pages site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "admin.html"
      - "admin.js"
      - "assessment.js"
      - "api-config.js"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          PAGES_VERSION: ${{ github.sha }}
        run: |
          mkdir dist
          cp index.html admin.html styles.css app.js admin.js api-config.js dist/
          node -e "require('node:fs').writeFileSync('dist/api-config.js', 'window.MIND_CHECKIN_API_BASE = ' + JSON.stringify(process.env.API_BASE_URL || 'https://mindful-checkin-api.ay455431.workers.dev') + ';\\n')"
          node -e "const fs = require('node:fs'); for (const page of ['index.html', 'admin.html']) { let html = fs.readFileSync('dist/' + page, 'utf8'); for (const file of ['styles.css', 'api-config.js', 'app.js', 'admin.js']) html = html.replaceAll('./' + file, './' + file + '?v=' + process.env.PAGES_VERSION); fs.writeFileSync('dist/' + page, html); }"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
